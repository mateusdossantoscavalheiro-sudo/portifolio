<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Viewer | Mateus</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/css/flag-icons.min.css">
    <link rel="stylesheet" href="Vstyle.css">
</head>
<body>

<header class="toolbar">
    <div class="lang-group">
        <button class="btn-lang active" data-lang="pt"><span class="fi fi-br"></span> PT</button>
        <button class="btn-lang" data-lang="en"><span class="fi fi-us"></span> EN</button>
        <button class="btn-lang" data-lang="es"><span class="fi fi-es"></span> ES</button>
        <button class="btn-lang" data-lang="de"><span class="fi fi-de"></span> DE</button>
    </div>

    <div id="file-name" class="title">Carregando documento...</div>

    <button id="download-btn" class="btn-download" onclick="window.print()">
        <i class="fa-solid fa-print"></i> Salvar / Imprimir
    </button>
</header>

<main id="pdf-render-container">
</main>

<div id="google_translate_element"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
<script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
<script src="Vscript.js"></script>

</body>
</html>
