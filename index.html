<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mateus - Portfolio for Projects</title>
    <link rel="icon" type="image/png" href="./assets/logo/logo_pi.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/css/flag-icons.min.css">

    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-mode">

<div id="contact-modal" class="modal-overlay">
    <div class="modal-content" style="max-width: 450px;">
        <button class="close-modal" onclick="closeAllModals()"><i class="fa-solid fa-xmark"></i></button>
        <h3>Vamos conversar?</h3>
        <div class="contact-links">
            <a href="https://wa.me/5547991814413" target="_blank" class="opt-btn"><i class="fa-brands fa-whatsapp"></i> WhatsApp</a>
            <a href="https://github.com/mateusdossantoscavalheiro-sudo" target="_blank" class="opt-btn"><i class="fa-brands fa-github"></i> GitHub</a>
        </div>
    </div>
</div>

<div id="project-modal" class="modal-overlay">
    <div class="modal-content">
        <button class="close-modal" onclick="closeAllModals()"><i class="fa-solid fa-xmark"></i></button>
        <div class="project-grid">
            <div class="project-left">
                <div class="miniature-display" id="modal-media"></div>
                <div class="project-info-mini">
                    <p><i class="fa-regular fa-calendar-days"></i> <strong>Criado em:</strong> <span id="modal-date"></span></p>
                    <p><i class="fa-solid fa-laptop-code"></i> <strong>Plataforma:</strong> <span id="modal-platform"></span></p>
                </div>
            </div>
            <div class="divider"></div>
            <div class="project-right">
                <h2 id="modal-title"></h2>
                <p id="modal-desc"></p>
                <div class="project-actions">
                    <a id="modal-github" href="#" target="_blank" class="opt-btn"><i class="fa-brands fa-github"></i> REPOSITÓRIO</a>
                    <a id="modal-pdf" href="#" target="_blank" class="opt-btn"><i class="fa-solid fa-file-pdf"></i> VER DOCUMENTO</a>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="main-wrapper">
    <header class="chat-header">
        <div class="header-left">
            <button class="menu-btn" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i> Menu</button>
            <div class="logo-wrapper">
                <img src="./assets/logo/logo_pi.png" id="main-logo" alt="Logo">
            </div>
            <span>Mateus | Product Designer & Dev</span>
        </div>
        <div class="header-right">
            <button class="header-icon-btn" onclick="toggleTheme()"><i id="theme-icon" class="fa-solid fa-sun"></i></button>
        </div>
    </header>

    <div class="layout-wrapper">
        <aside class="sidebar collapsed" id="sidebar">
            <h4>PROJETOS</h4>
            <div id="project-list"></div>
        </aside>

        <main class="chat-container">
            <div class="chat-box" id="chat-box">
                <div class="message bot-msg">Olá! Selecione um projeto na barra lateral para ver os detalhes técnicos.</div>
            </div>
            <div class="options">
                <button class="opt-btn" onclick="toggleSidebar()">Ver Projetos</button>
                <button class="opt-btn" onclick="openModal('contact-modal')">Contato</button>
            </div>
        </main>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
